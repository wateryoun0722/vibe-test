<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .canvas {
            width: 600px;
            height: 500px;
            overflow: auto; /*내용이 영역을 벗어나면 자동 스크롤*/
            border: 1px solid black;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            background-color: red;  
            margin:10px;
        }
    </style>
</head>
<body>
    <div class="canvas" id="canvas"></div>
    <div>
        <button type ="button" id='makeBtn'>생성</button>
        <button type ="button" id='delBtn'>삭제</button>
    </div>
</body>
<script>
    const makeBtn = document.getElementById('makeBtn');
    const delBtn = document.getElementById('delBtn');

    //버튼에다가 이벤트 주기
    //함수를 쓸 때 소괄호까지 붙이는 건 실행하라, 즉 호출의 의미
    //함수를 쓸 때 소괄호까지 빼고 쓰는건 이름을 알려줄 때, 실행의 의미는 아님
    makeBtn.addEventListener('click',makeBox);
    delBtn.addEventListener('click',delBox);

    const boxes = [];

    function makeBox() {
        const newBox = document.createElement('div');
        newBox.className='box';
        const canvas = document.getElementById('canvas');
        //배열에 박스 넣기
        boxes.push(newBox);

        for(let i =0; i<boxes.length; i++){
            canvas.append(boxes[i]);
        }
    }

    function delBox(){
        if(boxes.length>0){
            //배열하나 삭제
            boxes.pop(); //배열의 마지막 요소 삭제
        }
        const canvas = document.getElementById('canvas');
        canvas.innerHTML='';

        for(let i = 0; i< boxes.length; i++){
            canvas.append(boxes[i]);
        }

    }

    

</script>
</html>
