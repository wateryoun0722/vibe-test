<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
        선택자 란 css를 부여하는 대상
        div(태그 명) :  페이지에서 해당 태그 전체에 적용
        #id : id가 적용된 tag에 영향
        .class명 : 해당 클래스 명을 가진 태그에 적용

        색상 표현 : RGB 를 이용(Red, Green, Blue)
        색마다 최대값 255
        흰색 : 255,255,255
        검정색 : 0,0,0
        */
        .blue {
            background-color: blue;
        }

        .pink {
            background-color: rgb(255,195,203);
        }

        .ivory {
            background-color: #fffff0;
        }
    </style>

</head>
<body>
    <div class="blue">1</div>
    <div class="pink">2</div>
    <div class="ivory">3</div>
    <div class="ivory">4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
</body>
</html>
