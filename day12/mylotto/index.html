<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 행운 번호</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app container py-4">
    <!-- ① 헤더 -->
    <header class="text-center mb-4">
      <div class="logo mb-2"><i class="bi bi-suit-club-fill" aria-hidden="true"></i></div>
      <h1 class="title">오늘의 행운 번호</h1>
      <p class="subtitle">콕콕 찍어두면 알아서 골라줄게요</p>
    </header>

    <!-- ② 분할 번호판 -->
    <section class="row g-3 mb-3">
      <div class="col-12 col-md-6">
        <div class="pane pane-fixed">
          <div class="pane-head">
            <span class="pane-title"><i class="bi bi-heart-fill" aria-hidden="true"></i> 꼭 넣을 번호</span>
            <span class="badge-count" id="fixedCount">0 / 5</span>
          </div>
          <div class="board" id="fixedBoard" data-type="fixed" aria-label="꼭 넣을 번호 선택판"></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="pane pane-excluded">
          <div class="pane-head">
            <span class="pane-title"><i class="bi bi-slash-circle" aria-hidden="true"></i> 빼줄 번호</span>
            <span class="badge-count" id="excludedCount">0개</span>
          </div>
          <div class="board" id="excludedBoard" data-type="excluded" aria-label="빼줄 번호 선택판"></div>
        </div>
      </div>
    </section>

    <!-- ③ 액션 버튼 -->
    <section class="actions mb-4">
      <button type="button" class="btn btn-pill btn-soft" id="resetBtn">
        <i class="bi bi-eraser" aria-hidden="true"></i> 선택 초기화
      </button>
      <button type="button" class="btn btn-pill btn-main flex-grow-1" id="generateBtn">
        <i class="bi bi-stars" aria-hidden="true"></i> 행운 번호 뽑기 (5세트)
      </button>
    </section>

    <!-- ④ 결과 카드 -->
    <section class="result-card">
      <div class="result-head">
        <h2 class="result-title">뽑은 번호</h2>
        <button type="button" class="btn btn-pill btn-clear" id="clearBtn" hidden>
          <i class="bi bi-trash3" aria-hidden="true"></i> 결과 지우기
        </button>
      </div>
      <div id="resultList"></div>
    </section>
  </main>

  <!-- 토스트 -->
  <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
    <div class="toast cute-toast" id="toast" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="2000">
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
