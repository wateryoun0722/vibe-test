<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 날씨 어때</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app container py-4">
    <!-- ① 헤더 -->
    <header class="app-header mb-3">
      <h1 class="title"><i class="bi bi-cloud-sun" aria-hidden="true"></i> 오늘 날씨 어때</h1>
      <div class="unit-toggle" role="group" aria-label="온도 단위">
        <button type="button" class="unit-btn" id="unitC" data-unit="C" aria-pressed="true">°C</button>
        <button type="button" class="unit-btn" id="unitF" data-unit="F" aria-pressed="false">°F</button>
      </div>
    </header>

    <!-- ② 검색 -->
    <section class="mb-3">
      <form class="search" id="searchForm" novalidate>
        <label for="cityInput" class="visually-hidden">도시 이름</label>
        <input type="text" class="form-control search-input" id="cityInput"
               placeholder="도시 이름 (예: 서울, 부산, 제주)" autocomplete="off">
        <button type="submit" class="btn btn-pill btn-main" id="searchBtn">
          <span class="spinner-border spinner-border-sm" aria-hidden="true" hidden></span>
          <i class="bi bi-search" aria-hidden="true"></i>
          <span class="btn-text">검색</span>
        </button>
        <button type="button" class="btn btn-pill btn-soft" id="locBtn" aria-label="내 위치 날씨">
          <i class="bi bi-geo-alt" aria-hidden="true"></i>
        </button>
      </form>
      <p class="error-msg" id="errorMsg" role="alert"></p>
      <div class="recent" id="recentWrap" hidden>
        <span class="recent-label">최근 검색</span>
        <div class="recent-list" id="recentList"></div>
      </div>
    </section>

    <div id="weatherArea" class="weather-area" hidden>
      <!-- ③ 현재 날씨 카드 -->
      <section class="card-box current mb-3">
        <div class="icon-circle" id="iconCircle">
          <img id="currentIcon" src="" alt="" width="100" height="100">
        </div>
        <div class="current-info">
          <div class="city"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i> <span id="cityName"></span></div>
          <div class="temp" id="currentTemp"></div>
          <div class="summary">
            <span id="description"></span> · 체감 <span id="feelsLike"></span>
            · 최고 <span id="tempMax"></span> / 최저 <span id="tempMin"></span>
          </div>
        </div>
        <div class="updated" id="updatedAt"></div>
      </section>

      <!-- ④ 상세 정보 -->
      <section class="card-box mb-3">
        <h2 class="section-title">상세 정보</h2>
        <div class="row g-2">
          <div class="col-6 col-md-3">
            <div class="tile"><i class="bi bi-droplet" aria-hidden="true"></i><span class="tile-label">습도</span><strong id="humidity"></strong></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="tile"><i class="bi bi-wind" aria-hidden="true"></i><span class="tile-label">바람</span><strong id="wind"></strong></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="tile"><i class="bi bi-umbrella" aria-hidden="true"></i><span class="tile-label">강수확률</span><strong id="pop"></strong></div>
          </div>
          <div class="col-6 col-md-3">
            <div class="tile"><i class="bi bi-sunset" aria-hidden="true"></i><span class="tile-label">일몰</span><strong id="sunset"></strong></div>
          </div>
        </div>
      </section>

      <!-- ⑤ 5일 예보 -->
      <section class="card-box">
        <h2 class="section-title">5일 예보</h2>
        <div class="forecast" id="forecastList"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
